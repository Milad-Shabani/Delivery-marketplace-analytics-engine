[project]
name = "delivery-marketplace-analytics-engine"
version = "1.0.0"
description = "NOVAFOOD — an end-to-end food-delivery marketplace business analytics, financial planning, demand forecasting, and optimization case study (synthetic data)."
authors = [{ name = "Milad Shabani" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
